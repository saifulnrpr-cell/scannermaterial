<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบเบิกจ่ายวัสดุ (Mobile Scanner)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- 🟢 นำเข้า LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { display: none; }
        #reader { border: none !important; border-radius: 1.5rem; overflow: hidden; background: #0f172a; width: 100%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        #reader video { object-fit: cover; border-radius: 1.5rem; }
        #reader__dashboard_section_csr span, #reader__dashboard_section_csr button { color: #fff !important; }
    </style>
</head>
<body class="text-slate-800 h-[100dvh] overflow-hidden flex flex-col bg-slate-50">

    <!-- 🟢 Header แสดงชื่อผู้ใช้งานจาก LINE -->
    <div id="main-header" class="px-5 py-4 bg-white/90 backdrop-blur-xl flex justify-between items-center shrink-0 z-10 border-b border-slate-100 shadow-sm transition-colors duration-300">
        <!-- เพิ่ม onclick="openHeaderMenu()" ตรงนี้ -->
        <div class="flex items-center gap-3 cursor-pointer active:scale-95 transition-transform" onclick="openHeaderMenu()">
            <div id="header-icon-bg" class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30 transition-colors duration-300">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>
            </div>
            <div>
                <h1 id="header-title" class="text-base font-black text-slate-800 leading-tight transition-colors duration-300">ระบบเบิกจ่ายวัสดุ</h1>
                <div id="status-indicator" class="text-[10px] font-bold text-amber-500 flex items-center gap-1">
                    <div class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></div> กำลังตรวจสอบสิทธิ์...
                </div>
            </div>
        </div>
    </div>

    <!-- 🌟 พื้นที่หลัก (เครื่องมือ + รายการวัสดุ) -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
        <div class="px-4 py-3 bg-white shrink-0 z-10 shadow-[0_10px_20px_-15px_rgba(0,0,0,0.05)]">
            <div class="flex items-center gap-2">
                <div class="flex-1 relative group min-w-0">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="w-4 h-4 text-slate-400 group-focus-within:text-blue-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    </div>
                    <input type="text" id="pos-search" oninput="window.posSearchTerm = this.value.toLowerCase(); renderPOSProducts();" placeholder="ค้นหา..." class="w-full pl-9 pr-2 h-[42px] bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-blue-400 focus:bg-white transition-all font-bold text-slate-700 shadow-inner">
                </div>
                <select id="pos-cat" onchange="window.posCategory = this.value; renderPOSProducts();" class="w-[90px] sm:w-[110px] px-2 h-[42px] bg-slate-50 border border-slate-200 rounded-xl text-[11px] outline-none focus:border-blue-400 focus:bg-white font-bold text-slate-700 truncate shrink-0 shadow-inner">
                    <option value="all">ทั้งหมด</option>
                </select>
                <button onclick="openScanner()" class="w-[42px] h-[42px] shrink-0 bg-slate-800 hover:bg-slate-700 text-white rounded-xl shadow-md active:scale-95 transition-all flex items-center justify-center focus:outline-none">
                    <svg class="w-5 h-5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
                </button>
            </div>
        </div>
        
        <div id="pos-product-grid" class="flex-1 overflow-y-auto p-4 pb-24 custom-scrollbar grid grid-cols-2 md:grid-cols-3 gap-3 content-start"></div>
    </div>

    <!-- 🌟 ปุ่มตะกร้าแบบลอย (Floating Action Button) -->
    <div class="fixed bottom-6 right-6 z-40">
        <button onclick="toggleCartModal(true)" id="floating-cart-btn" class="w-16 h-16 bg-white border-2 border-slate-100 text-slate-400 rounded-full shadow-[0_10px_25px_rgba(0,0,0,0.1)] flex items-center justify-center relative transition-all duration-300 focus:outline-none active:scale-90">
            <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
            <div id="floating-cart-badge" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-black shadow-md border-2 border-white transition-all transform scale-0 origin-center">0</div>
        </button>
    </div>

    <!-- 🌟 Modal ตะกร้า -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-slate-50 flex flex-col transform translate-y-full transition-transform duration-300 ease-in-out">
        <div class="bg-white px-4 py-4 flex justify-between items-center shadow-sm z-10 shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="toggleCartModal(false)" class="w-10 h-10 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center active:bg-slate-200 transition-colors focus:outline-none">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" /></svg>
                </button>
                <h2 class="text-lg font-black text-slate-800">ตะกร้าของคุณ</h2>
            </div>
            <span id="modal-cart-count" class="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg text-xs font-black">0 รายการ</span>
        </div>

        <div class="flex-1 overflow-y-auto p-4 custom-scrollbar pb-32">
            <div id="pos-cart-items" class="flex flex-col gap-3 mb-6"></div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h3 class="text-sm font-black text-slate-700 border-b border-slate-100 pb-2">ข้อมูลอ้างอิง</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">วันที่ทำรายการ</label>
                        <input type="date" id="pos-date" class="w-full px-3 py-2.5 bg-slate-100 border border-slate-200 rounded-xl text-xs font-bold text-slate-500 outline-none" readonly>
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">อ้างอิงผู้เบิก (ล็อกอัตโนมัติ)</label>
                        <input type="text" id="pos-ref" class="w-full px-3 py-2.5 bg-blue-50 border border-blue-200 rounded-xl text-xs font-bold text-blue-800 outline-none shadow-inner" readonly>
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">หมายเหตุ (ถ้ามี)</label>
                    <input type="text" id="pos-remark" placeholder="เช่น ใช้สำหรับงานประชุม..." class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-blue-400 text-slate-700">
                </div>
            </div>
        </div>

        <div class="absolute bottom-0 w-full bg-white p-5 border-t border-slate-100 z-20 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] pb-8">
            <button type="button" onclick="submitPOS()" class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 active:scale-95 text-white font-black text-sm rounded-2xl shadow-lg shadow-blue-500/30 transition-all flex items-center justify-center gap-2 focus:outline-none">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" /></svg>
                ยืนยันการตัดสต๊อก
            </button>
        </div>
    </div>

    <!-- Overlay Scanner -->
    <div id="scanner-overlay" class="hidden fixed inset-0 z-[100] bg-slate-900/95 backdrop-blur-sm flex flex-col">
        <div class="p-5 flex justify-between items-center text-white shrink-0">
            <h3 class="text-lg font-black flex items-center gap-2"><svg class="w-6 h-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg> สแกนบาร์โค้ด</h3>
            <button onclick="closeScanner()" class="w-10 h-10 bg-white/20 hover:bg-rose-500 rounded-full flex items-center justify-center transition-colors focus:outline-none">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- 🟢 เมนูสลับโหมดสแกน (Normal / Continuous) -->
        <div class="px-5 mt-2 flex justify-center">
            <div class="bg-slate-800 p-1.5 rounded-xl flex items-center gap-1 shadow-inner w-full max-w-sm relative">
                <button id="btn-scan-normal" onclick="setScanMode('normal')" class="flex-1 py-2 rounded-lg text-[11px] font-bold bg-blue-500 text-white shadow-sm transition-all focus:outline-none tracking-wide">ระบุจำนวน</button>
                <button id="btn-scan-continuous" onclick="setScanMode('continuous')" class="flex-1 py-2 rounded-lg text-[11px] font-bold bg-transparent text-slate-400 hover:text-white transition-all focus:outline-none flex items-center justify-center gap-1 tracking-wide">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> สแกนรัว (ทีละ 1)
                </button>
            </div>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center p-4 relative">
            <div id="reader" class="w-full"></div>
            <p id="scanner-instruction" class="text-slate-400 text-sm mt-6 text-center">หันกล้องไปที่บาร์โค้ดเพื่อค้นหาและเลือกจำนวน</p>
            
            <!-- 🟢 แจ้งเตือนแบบ Toast ลอยขึ้นมาเวลาสแกนรัว -->
            <div id="scan-toast" class="absolute bottom-10 left-1/2 -translate-x-1/2 bg-emerald-500/90 backdrop-blur-md text-white px-6 py-3 rounded-full shadow-[0_10px_30px_rgba(0,0,0,0.3)] text-sm font-bold flex items-center gap-2 transform translate-y-10 opacity-0 transition-all duration-300 pointer-events-none z-10 whitespace-nowrap border border-white/20">
                <span id="scan-toast-icon"></span>
                <span id="scan-toast-text">เพิ่มลงตะกร้าแล้ว</span>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="modern-loader" class="fixed inset-0 z-[99999] flex-col items-center justify-center bg-[#050814]/80 backdrop-blur-xl transition-opacity duration-300 opacity-0 hidden">
        <div class="w-full max-w-sm px-8 flex flex-col items-center transform transition-transform duration-300 scale-95" id="modern-loader-box">
            <h3 id="loader-title" class="text-white font-light tracking-[0.2em] text-sm mb-3">LOADING....</h3>
            <div class="w-full h-5 rounded-full border border-blue-500/50 p-[3px] bg-[#02040a] overflow-hidden shadow-[0_0_15px_rgba(59,130,246,0.3)]">
                <div id="loader-progress-bar" class="h-full rounded-full bg-gradient-to-r from-blue-600 via-purple-500 to-fuchsia-500 w-[0%] transition-all duration-200 ease-out shadow-[0_0_10px_rgba(217,70,239,0.8)]"></div>
            </div>
            <p id="loader-desc" class="text-slate-400 text-[10px] mt-4 font-light tracking-wide text-center"></p>
        </div>
    </div>

    <!-- 🟢 Fallback UI (หน้าจอสำรองเมื่อโหลดค้าง) -->
    <div id="fallback-ui" class="fixed inset-0 z-[100000] flex flex-col items-center justify-center bg-slate-900/40 backdrop-blur-md hidden transition-opacity duration-300 opacity-0">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl flex flex-col items-center max-w-sm w-[90%] border border-slate-100 text-center transform scale-95 transition-transform duration-300" id="fallback-box">
            <div class="w-20 h-20 bg-rose-50 rounded-full flex items-center justify-center mb-4 border border-rose-100 shadow-inner">
                <svg class="w-10 h-10 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
            </div>
            <h3 class="text-xl font-black text-slate-800 mb-2">เชื่อมต่อระบบล่าช้า</h3>
            <p class="text-sm font-medium text-slate-500 mb-6">ระบบใช้เวลาเชื่อมนานกว่าปกติ หรือคุณอาจจะยังไม่ได้ยืนยันสิทธิ์เข้าสู่ระบบ LINE</p>
            
            <button onclick="manualLiffLogin()" class="w-full bg-[#00B900] hover:bg-[#00A000] text-white font-bold py-3.5 rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 mb-3 focus:outline-none">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M24 10.304c0-5.369-5.383-9.738-12-9.738-6.616 0-12 4.369-12 9.738 0 4.814 4.269 8.846 10.036 9.608.391.084.922.258 1.057.592.122.303.08.778.039 1.085l-.171 1.027c-.053.303-.242 1.186 1.039.647 1.281-.54 6.911-4.069 9.428-6.967 1.739-1.907 2.572-4.14 2.572-6.002v.01zm-15.549 1.839h-2.186v-3.79c0-.414-.336-.75-.75-.75s-.75.336-.75.75v4.54c0 .414.336.75.75.75h2.936c.414 0 .75-.336.75-.75s-.336-.75-.75-.75zm5.792 0h-2.186v-3.79c0-.414-.336-.75-.75-.75s-.75.336-.75.75v4.54c0 .414.336.75.75.75h2.936c.414 0 .75-.336.75-.75s-.336-.75-.75-.75zm2.844-3.79l-2.023 2.668v-2.668c0-.414-.336-.75-.75-.75s-.75.336-.75.75v4.54c0 .414.336.75.75.75v-2.668l2.023 2.668c.174.229.435.353.696.353.138 0 .278-.031.411-.097.35-.176.574-.53.574-.925v-4.54c0-.414-.336-.75-.75-.75s-.75.336-.75.75v4.54zm-9.351 4.54c0 .414.336.75.75.75s.75-.336.75-.75v-4.54c0-.414-.336-.75-.75-.75s-.75.336-.75.75v4.54z"/></svg>
                เข้าสู่ระบบด้วย LINE
            </button>
            
            <button onclick="location.reload()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3.5 rounded-2xl transition-all flex items-center justify-center gap-2 focus:outline-none">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357-2H15" /></svg>
                รีเฟรชหน้าจอใหม่
            </button>
        </div>
    </div>

    <script>
       
        // ==========================================
        // 🚨 ตั้งค่า URL และ LIFF ID
        // ==========================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwbr1EudGM8AzYD1w9ah-K-nOxguYNmHWIoIcEK_HpEM9KzZI-WQD2nALGJcpfwv1DUtw/exec"; 
        const LIFF_ID = "2012505015-MGj5SCil"; // ไอดี LIFF ของคุณ
        
        let matStockData = [];
        let posCart = [];
        let html5QrcodeScanner;
        let posSearchTerm = '';
        let posCategory = 'all';
        let scanCooldown = false;
        
        let userRealName = ""; 
        let userAccessRight = ""; // 🟢 ประกาศตัวแปรเก็บสิทธิ์ที่ระดับโกลบอล
        let isAdminMode = false;  
        let scannerMode = 'dispense'; 
        let editTargetItem = null; 

        const beepSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
        let liffTimeoutId; 

        document.addEventListener("DOMContentLoaded", async function() {
            let ts = new Date();
            document.getElementById('pos-date').value = ts.getFullYear() + "-" + String(ts.getMonth() + 1).padStart(2, '0') + "-" + String(ts.getDate()).padStart(2, '0');
            
            showGlobalLoading('กำลังเชื่อมต่อระบบ...', 'เพื่อยืนยันตัวตนการเข้าใช้งาน');
            
            try {
                await liff.init({ liffId: LIFF_ID });
                
                if (liff.isLoggedIn()) {
                    await processLiffLogin();
                } else {
                    if (liff.isInClient()) {
                        hideGlobalLoading();
                        Swal.fire('ข้อผิดพลาดจาก LINE', 'ไม่สามารถอ่านข้อมูลโปรไฟล์ได้ กรุณาปิดแล้วเปิดใหม่', 'error');
                    } else {
                        liff.login();
                    }
                }
            } catch (err) {
                hideGlobalLoading();
                console.error("LIFF Init Error:", err);
                Swal.fire('ระบบขัดข้อง', 'การเชื่อมต่อ LIFF ล้มเหลว โปรดลองรีเฟรชหน้าจออีกครั้ง', 'error');
            }
        });

        async function processLiffLogin() {
            try {
                const profile = await liff.getProfile();
                await verifyLiffUser(profile);
            } catch (err) {
                hideGlobalLoading();
                console.error("Profile Error:", err);
                Swal.fire({
                    title: 'เชื่อมต่อขัดข้อง',
                    text: 'ไม่สามารถดึงข้อมูลโปรไฟล์จากบัญชี LINE ของคุณได้ โปรดลองอีกครั้ง',
                    icon: 'warning',
                    confirmButtonColor: '#3b82f6'
                }).then(() => {
                    location.reload(); 
                });
            }
        }

        async function verifyLiffUser(profile) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 12000); 

                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'verifyLiffUser', userId: profile.userId }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const res = await response.json();

                if (res.status === 'success') {
                    userRealName = res.user.name;
                    // 🟢 ตรวจสอบให้ชัวร์ว่าเราดึงสิทธิ์ผู้ใช้งานมาเก็บไว้จริงๆ
                    userAccessRight = res.user.access || ''; 
                    
                    document.getElementById('pos-ref').value = userRealName; 
                    
                    let picUrl = profile.pictureUrl || ('https://ui-avatars.com/api/?name=' + encodeURIComponent(profile.displayName) + '&background=dbeafe&color=1e40af&size=128&rounded=true&bold=true');

                    let statusEl = document.getElementById('status-indicator');
                    statusEl.className = 'text-[11px] font-bold text-emerald-600 flex items-center gap-1.5 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-100 shadow-sm transition-all';
                    statusEl.innerHTML = `<img src="${picUrl}" class="w-4 h-4 rounded-full border border-emerald-200"> ${userRealName}`;
                    
                    hideGlobalLoading(); 

                    if ('speechSynthesis' in window) {
                        let speech = new SpeechSynthesisUtterance("เข้าสู่ระบบสำเร็จ ยินดีต้อนรับค่ะ");
                        speech.lang = 'th-TH'; speech.rate = 1.0; speech.pitch = 1.0;
                        window.speechSynthesis.speak(speech); 
                    } else {
                        beepSound.play().catch(e=>{});
                    }

                    Swal.fire({
                        html: `
                            <div class="flex flex-col items-center font-prompt mt-2">
                                <div class="relative mb-5 mt-2">
                                    <div class="absolute inset-0 bg-gradient-to-r from-blue-400 via-indigo-500 to-purple-500 rounded-full blur-[15px] opacity-60 animate-pulse"></div>
                                    <img src="${picUrl}" class="w-24 h-24 md:w-28 md:h-28 rounded-full relative z-10 border-[4px] border-white shadow-xl object-cover">
                                    <div class="absolute -bottom-1 -right-1 bg-emerald-500 text-white p-1.5 rounded-full border-[3px] border-white z-20 shadow-lg">
                                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                                    </div>
                                </div>
                                <h2 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 mb-3 tracking-tight drop-shadow-sm">เข้าสู่ระบบสำเร็จ!</h2>
                                <div class="bg-blue-50/80 px-5 py-2.5 rounded-xl border border-blue-100 mb-4 shadow-inner w-full max-w-[240px] text-center">
                                    <p class="text-[10px] text-blue-500 font-bold uppercase tracking-widest mb-0.5">LINE ACCOUNT</p>
                                    <p class="text-sm font-black text-blue-800 truncate">${profile.displayName}</p>
                                </div>
                                <p class="text-sm font-medium text-slate-500 leading-relaxed text-center">ยินดีต้อนรับคุณ <span class="font-bold text-slate-700">${userRealName}</span><br>เข้าสู่ระบบเบิกจ่ายวัสดุ</p>
                            </div>
                        `,
                        showConfirmButton: true,
                        confirmButtonText: '<div class="flex items-center justify-center gap-2">ดำเนินการต่อ <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6" /></svg></div>',
                        buttonsStyling: false,
                        allowOutsideClick: false,
                        customClass: {
                            popup: '!rounded-[2.5rem] p-6 md:p-8 shadow-2xl border-t-8 border-blue-500',
                            confirmButton: 'w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black py-3.5 rounded-2xl shadow-lg shadow-blue-500/30 transition-all mt-6 text-base'
                        }
                    }).then(() => {
                        fetchStockData(); 
                    });

                } else if (res.status === 'pending_approval') {
                    hideGlobalLoading();
                    Swal.fire({
                        title: '<span class="text-xl font-black text-amber-500">รอการอนุมัติ</span>',
                        html: '<p class="text-slate-600 font-prompt text-sm mt-2">บัญชีของคุณลงทะเบียนเรียบร้อยแล้ว<br>แต่ยังไม่ได้รับการเปิดสิทธิ์จากผู้ดูแลระบบ<br><br><span class="text-xs text-rose-500 font-bold bg-rose-50 px-3 py-1.5 rounded-lg border border-rose-100 shadow-sm">*โปรดแจ้งแอดมินให้เปลี่ยนสถานะเป็น "ปกติ"</span></p>',
                        icon: 'info',
                        allowOutsideClick: false,
                        showConfirmButton: false,
                        customClass: { popup: '!rounded-[2rem] shadow-2xl' }
                    });

                } else if (res.status === 'not_found') {
                    hideGlobalLoading();
                    promptUserRegistration(profile);
                } else {
                    hideGlobalLoading();
                    Swal.fire({title:'ไม่อนุญาต', text: res.message, icon:'error', allowOutsideClick:false, showConfirmButton:false, customClass:{popup:'!rounded-[2rem]'}});
                }
            } catch (e) {
                hideGlobalLoading();
                console.error("Verify Error:", e);
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ตรวจสอบสิทธิ์ได้', 'error');
            }
        }

        function promptUserRegistration(profile) {
            Swal.fire({
                title: 'ลงทะเบียนใช้งานครั้งแรก',
                html: `
                    <div class="text-center font-prompt mt-2">
                        <img src="${profile.pictureUrl}" class="w-20 h-20 rounded-full mx-auto mb-3 shadow-md border-2 border-white">
                        <p class="text-[10px] font-bold text-slate-400 mb-4 uppercase tracking-widest">LINE: ${profile.displayName}</p>
                        <p class="text-sm font-bold text-slate-700 mb-2 text-left">ระบุชื่อ-นามสกุลจริงของคุณ เพื่อใช้เป็น "อ้างอิงผู้เบิก" ในระบบ:</p>
                        <input type="text" id="reg-realname" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-prompt text-sm focus:border-blue-400 focus:bg-white outline-none transition-colors shadow-inner" placeholder="ระบุ ชื่อ-นามสกุล...">
                    </div>`,
                confirmButtonText: 'บันทึกข้อมูล',
                allowOutsideClick: false,
                buttonsStyling: false,
                customClass: {
                    popup: '!rounded-[2rem] p-6 shadow-2xl',
                    confirmButton: 'w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl shadow-md transition-all mt-4'
                },
                preConfirm: () => {
                    const name = document.getElementById('reg-realname').value.trim();
                    if (!name) { Swal.showValidationMessage('กรุณาระบุชื่อ-นามสกุลให้ครบถ้วน'); return false; }
                    return name;
                }
            }).then(result => {
                if (result.isConfirmed) {
                    showGlobalLoading('กำลังลงทะเบียน...', 'บันทึกข้อมูลและสร้างสิทธิ์เข้าใช้งาน');
                    
                    fetch(GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'registerLiffUser', userId: profile.userId, lineName: profile.displayName, realName: result.value })
                    }).then(r => r.json()).then(regRes => {
                        hideGlobalLoading();
                        if (regRes.status === 'pending_approval') {
                            if ('speechSynthesis' in window) {
                                let speech = new SpeechSynthesisUtterance("ลงทะเบียนสำเร็จ รอแอดมินอนุมัติคำขอ สักครู่นะคะ");
                                speech.lang = 'th-TH'; speech.rate = 1.0; speech.pitch = 1.0;
                                window.speechSynthesis.speak(speech);
                            }
                            Swal.fire({
                                title: '<span class="text-xl font-black text-emerald-600">ลงทะเบียนสำเร็จ!</span>',
                                html: '<p class="text-slate-600 font-prompt text-sm mt-2">ระบบบันทึกข้อมูลของคุณแล้ว<br><span class="text-blue-600 font-bold bg-blue-50 px-3 py-1 rounded-lg mt-2 inline-block shadow-sm">กรุณารอแอดมินอนุมัติสิทธิ์</span><br><br><span class="text-xs text-slate-400">ก่อนเข้าใช้งานระบบเบิกจ่ายครับ</span></p>',
                                icon: 'success', allowOutsideClick: false, showConfirmButton: false, customClass: { popup: '!rounded-[2rem] shadow-2xl' }
                            });
                        } else {
                            Swal.fire('เกิดข้อผิดพลาด', regRes.message, 'error');
                        }
                    }).catch(err => {
                        hideGlobalLoading();
                        Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
                    });
                }
            });
        }
        function fetchStockData() {
            showGlobalLoading('กำลังดึงข้อมูลวัสดุ...', 'ดึงข้อมูลคลังจากฐานข้อมูล');
            fetch(GAS_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'fetchMaterialOnly' }) 
            })
            .then(r => r.json())
            .then(result => {
                hideGlobalLoading(); 
                if (result.status === 'success') {
                    matStockData = result.matStockData || [];
                    matStockData.forEach((row, idx) => { row.originalIndex = idx + 1; });

                    let cats = [...new Set(matStockData.map(r => String(r[4]||'').trim()).filter(c => c))].sort();
                    document.getElementById('pos-cat').innerHTML = '<option value="all">ทั้งหมด</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');

                    renderPOSProducts();
                    renderPOSCart();
                }
            }).catch(e => {
                hideGlobalLoading();
                Swal.fire({ title:'เกิดข้อผิดพลาด', text: 'ไม่สามารถดึงข้อมูลคลังได้', icon:'error', customClass:{popup:'!rounded-3xl'} });
            });
        }

        window.toggleCartModal = function(show) {
            const modal = document.getElementById('cart-modal');
            if (show) {
                if(posCart.length === 0) {
                    Swal.fire({ title: 'ตะกร้าว่างเปล่า', text: 'กรุณาเลือกวัสดุก่อนครับ', icon: 'info', confirmButtonColor: '#3b82f6', customClass: { popup: '!rounded-3xl' } });
                    return;
                }
                modal.classList.remove('translate-y-full');
            } else {
                modal.classList.add('translate-y-full');
            }
        };

        const getCategoryTheme = (category) => {
            if (category.includes('คอมพิวเตอร์') || category.includes('ไอที')) return { border: 'from-blue-600 to-indigo-500', text: 'text-indigo-600', badge: 'from-blue-500 to-indigo-500' };
            if (category.includes('สำนักงาน') || category.includes('กระดาษ')) return { border: 'from-emerald-400 to-teal-500', text: 'text-teal-600', badge: 'from-emerald-400 to-teal-500' };
            if (category.includes('บ้าน') || category.includes('ครัว')) return { border: 'from-amber-400 to-orange-500', text: 'text-orange-600', badge: 'from-amber-400 to-orange-500' };
            if (category.includes('แพทย์') || category.includes('ยา')) return { border: 'from-cyan-400 to-blue-500', text: 'text-cyan-600', badge: 'from-cyan-400 to-blue-500' };
            return { border: 'from-indigo-400 to-blue-500', text: 'text-indigo-600', badge: 'from-indigo-400 to-blue-500' };
        };

        // ==========================================
        // 🟢 เรนเดอร์รายการสินค้า
        // ==========================================
        window.renderPOSProducts = function() {
            let container = document.getElementById('pos-product-grid');
            if(!matStockData || !matStockData.length) return;

            let searchVal = window.posSearchTerm || '';
            let catVal = window.posCategory || 'all';

            let filtered = matStockData.filter(row => {
                let qty = parseFloat(row[5]) || 0;
                if (!isAdminMode && qty <= 0) return false; 
                
                let matchSearch = searchVal === '' || (row[1]||'').toLowerCase().includes(searchVal) || (row[2]||'').toLowerCase().includes(searchVal);
                let matchCat = catVal === 'all' || (row[4]||'') === catVal;
                
                return matchSearch && matchCat;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="col-span-full py-10 flex flex-col items-center justify-center text-slate-400 font-bold"><div class="w-20 h-20 bg-white rounded-full shadow-sm flex items-center justify-center mb-4"><svg class="w-10 h-10 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg></div><p>ไม่พบวัสดุที่ค้นหา หรือวัสดุหมดสต๊อก</p></div>';
                return;
            }

            let html = '';
            filtered.forEach(row => {
                let code = row[0], barcode = row[1] || '', name = row[2] || '', cat = row[4] || '-', loc = row[9] || '-';
                let qty = parseFloat(row[5]) || 0, unit = row[6] || '', price = parseFloat(row[7]) || 0;
                
                let theme = getCategoryTheme(cat);
                let imgs = []; try { imgs = JSON.parse(row[11] || '[]'); } catch(e){}
                let imgUrl = imgs.length > 0 ? 'https://drive.google.com/thumbnail?id=' + imgs[0] + '&sz=w300' : '';
                
                let imgTag = imgUrl ? `<img src="${imgUrl}" class="w-full h-full object-contain p-1 mix-blend-multiply">` : `<div class="w-full h-full flex items-center justify-center text-slate-300"><svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></div>`;

                let inCart = posCart.find(c => c.index === row.originalIndex);
                let cartQty = inCart ? inCart.qty : 0;
                let remain = qty - cartQty;
                let isDisable = remain <= 0;

                // 🟢 สร้างจุดสีเขียว/แดง สำหรับโหมดแอดมิน
                let adminDotHtml = '';
                if (isAdminMode) {
                    isDisable = false; 
                    if (barcode && barcode !== '-') {
                        adminDotHtml = '<span class="absolute top-2 left-2 w-3.5 h-3.5 bg-emerald-500 rounded-full border-2 border-white shadow-md z-20" title="มีบาร์โค้ดแล้ว"></span>';
                    } else {
                        adminDotHtml = '<span class="absolute top-2 left-2 w-3.5 h-3.5 bg-rose-500 animate-pulse rounded-full border-2 border-white shadow-md z-20" title="ยังไม่มีบาร์โค้ด"></span>';
                    }
                }

                let safeName = name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                let actionCall = isAdminMode ? `openBarcodeEditor(${row.originalIndex})` : (isDisable ? '' : `addToCart(${row.originalIndex}, '${code}', '${barcode}', '${safeName}', ${qty}, '${unit}', ${price})`);

                html += `
                <div class="relative w-full aspect-square rounded-2xl bg-gradient-to-br ${theme.border} p-[2px] shadow-sm active:scale-95 transition-all ${isDisable ? 'opacity-50 grayscale' : 'cursor-pointer hover:-translate-y-1'}" onclick="${actionCall}">
                    <div class="w-full h-full bg-white rounded-[calc(1rem-2px)] flex flex-col overflow-hidden relative">
                        ${adminDotHtml}
                        ${!isAdminMode && cartQty > 0 ? `<div class="absolute top-1.5 right-1.5 bg-rose-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-black shadow-md z-10 border-2 border-white">${cartQty}</div>` : ''}
                        <div class="flex-1 min-h-0 w-full bg-white flex items-center justify-center p-2">${imgTag}</div>
                        <div class="flex justify-between items-center px-2 py-1.5 gap-1 shrink-0">
                            <h4 class="text-[11px] font-black text-slate-800 truncate flex-1">${name}</h4>
                            <div class="bg-gradient-to-r ${theme.badge} text-white rounded px-1.5 py-0.5 flex items-baseline gap-0.5 shrink-0">
                                <span class="text-sm font-black leading-none">${remain}</span>
                                <span class="text-[8px] font-bold leading-none">${unit}</span>
                            </div>
                        </div>
                        <div class="border-t border-slate-100 flex justify-between items-center px-2 py-1.5 shrink-0">
                            <span class="text-[8px] font-black ${theme.text} truncate pr-1">${cat}</span>
                            <span class="text-[8px] font-black ${theme.text} shrink-0">${loc}</span>
                        </div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        window.addToCart = function(index, code, barcode, name, maxQty, unit, price) {
            let existing = posCart.find(c => c.index === index);
            if (existing) {
                if (existing.qty < maxQty) existing.qty++;
            } else {
                posCart.push({ index, code, barcode, name, maxQty, qty: 1, unit, price });
            }
            renderPOSCart();
            renderPOSProducts();
        }

        window.updateCartQty = function(cartIdx, delta) {
            let item = posCart[cartIdx];
            if(!item) return;
            item.qty += delta;
            if (item.qty <= 0) posCart.splice(cartIdx, 1);
            else if (item.qty > item.maxQty) item.qty = item.maxQty;
            renderPOSCart();
            renderPOSProducts();
            if(posCart.length === 0) toggleCartModal(false); 
        }

        window.removeFromCart = function(cartIdx) {
            posCart.splice(cartIdx, 1);
            renderPOSCart();
            renderPOSProducts();
            if(posCart.length === 0) toggleCartModal(false);
        }

        window.renderPOSCart = function() {
            let container = document.getElementById('pos-cart-items');
            let mainBtn = document.getElementById('floating-cart-btn');
            let mainBadge = document.getElementById('floating-cart-badge');
            
            document.getElementById('modal-cart-count').innerText = posCart.length + " รายการ";

            if (posCart.length === 0) {
                container.innerHTML = '<div class="py-10 text-center text-slate-400 font-bold">ตะกร้าว่างเปล่า</div>';
                mainBtn.className = "w-16 h-16 bg-white border-2 border-slate-100 text-slate-400 rounded-full shadow-[0_10px_25px_rgba(0,0,0,0.1)] flex items-center justify-center relative transition-all duration-300 focus:outline-none";
                mainBadge.classList.replace('scale-100', 'scale-0'); 
                return;
            }

            mainBtn.className = "w-16 h-16 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-full shadow-[0_10px_25px_rgba(37,99,235,0.4)] flex items-center justify-center relative transition-all duration-300 focus:outline-none active:scale-90 hover:-translate-y-1";
            mainBadge.classList.replace('scale-0', 'scale-100'); 
            mainBadge.innerText = posCart.length;

            let html = '';
            posCart.forEach((item, idx) => {
                html += `
                <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between gap-2">
                    <div class="flex-1 min-w-0 pr-1">
                        <p class="text-[9px] font-black text-blue-500 tracking-widest truncate uppercase">${item.barcode || item.code}</p>
                        <h4 class="text-xs font-black text-slate-800 truncate">${item.name}</h4>
                    </div>
                    <div class="flex flex-col items-end gap-1 shrink-0">
                        <div class="flex items-center bg-slate-50 border border-slate-100 rounded-full p-0.5">
                            <button onclick="updateCartQty(${idx}, -1)" class="w-6 h-6 flex items-center justify-center rounded-full bg-white text-slate-500 shadow-sm active:bg-rose-50 focus:outline-none"><svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M20 12H4"/></svg></button>
                            <div class="flex items-baseline gap-1 w-10 justify-center">
                                <span class="text-xs font-black text-slate-800 tabular-nums">${item.qty}</span>
                            </div>
                            <button onclick="updateCartQty(${idx}, 1)" class="w-6 h-6 flex items-center justify-center rounded-full bg-white text-blue-600 shadow-sm active:bg-blue-50 focus:outline-none"><svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"/></svg></button>
                        </div>
                        <span class="text-[9px] font-bold text-slate-400 mr-1">${item.unit}</span>
                    </div>
                    <button onclick="removeFromCart(${idx})" class="w-8 h-8 shrink-0 flex items-center justify-center text-rose-400 bg-rose-50 rounded-full ml-1 active:bg-rose-100 focus:outline-none"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
                </div>`;
            });
            container.innerHTML = html;
        }

        // ==========================================
        // 🟢 ระบบจัดการกล้อง และ โหมดสแกนต่อเนื่อง (Batch Scan)
        // ==========================================
        let isContinuousScanMode = false;

        window.setScanMode = function(mode) {
            isContinuousScanMode = (mode === 'continuous');
            const btnNormal = document.getElementById('btn-scan-normal');
            const btnCont = document.getElementById('btn-scan-continuous');
            const instruction = document.getElementById('scanner-instruction');
            
            if (isContinuousScanMode) {
                btnNormal.className = "flex-1 py-2 rounded-lg text-[11px] font-bold bg-transparent text-slate-400 hover:text-white transition-all focus:outline-none tracking-wide";
                btnCont.className = "flex-1 py-2 rounded-lg text-[11px] font-bold bg-emerald-500 text-white shadow-sm transition-all focus:outline-none flex items-center justify-center gap-1 tracking-wide";
                instruction.innerHTML = 'โหมดสแกนรัว: <span class="text-emerald-400">ระบบจะเพิ่มของใส่ตะกร้าทีละ 1 ชิ้นอัตโนมัติ</span>';
            } else {
                btnNormal.className = "flex-1 py-2 rounded-lg text-[11px] font-bold bg-blue-500 text-white shadow-sm transition-all focus:outline-none tracking-wide";
                btnCont.className = "flex-1 py-2 rounded-lg text-[11px] font-bold bg-transparent text-slate-400 hover:text-white transition-all focus:outline-none flex items-center justify-center gap-1 tracking-wide";
                instruction.innerText = "หันกล้องไปที่บาร์โค้ดเพื่อค้นหาและเลือกจำนวน";
            }
        }

        window.showScannerToast = function(msg, type = 'success') {
            const toast = document.getElementById('scan-toast');
            const textEl = document.getElementById('scan-toast-text');
            const iconEl = document.getElementById('scan-toast-icon');
            if(!toast || !textEl) return;
            
            textEl.innerText = msg;
            if(type === 'error') {
                toast.classList.replace('bg-emerald-500/90', 'bg-rose-500/90');
                if(!toast.classList.contains('bg-rose-500/90')) toast.classList.add('bg-rose-500/90'); // Fallback
                iconEl.innerHTML = '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg>';
            } else {
                toast.classList.remove('bg-rose-500/90');
                toast.classList.add('bg-emerald-500/90');
                iconEl.innerHTML = '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>';
            }

            toast.classList.remove('translate-y-10', 'opacity-0');
            
            // ซ่อนอัตโนมัติหลังผ่านไป 1.5 วินาที
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); }, 1500);
        }

        function openScanner() {
            document.getElementById('scanner-overlay').classList.remove('hidden');
            
            if (html5QrcodeScanner) { try { html5QrcodeScanner.clear(); } catch(e){} }
            
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
                fps: 15, 
                qrbox: { width: 280, height: 100 }, 
                aspectRatio: 1.777778,
                showTorchButtonIfSupported: true,
                disableFlip: true,
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.QR_CODE
                ],
                experimentalFeatures: { useBarCodeDetectorIfSupported: true }
            }, false);
            
            html5QrcodeScanner.render(onScanSuccess);
        }

        function closeScanner() {
            document.getElementById('scanner-overlay').classList.add('hidden');
            if (html5QrcodeScanner) html5QrcodeScanner.clear();
            scanCooldown = false; // เคลียร์ระบบป้องกันการสแกนเบิ้ล
        }

        function onScanSuccess(decodedText) {
            if (scannerMode === 'admin_edit') {
                beepSound.play().catch(e=>{});
                if (navigator.vibrate) navigator.vibrate(100); 
                closeScanner();
                let newBarcode = decodedText.trim();
                
                let duplicate = matStockData.find(r => r[1] === newBarcode && r.originalIndex !== editTargetItem);
                if (duplicate) {
                    Swal.fire({
                        title: 'บาร์โค้ดซ้ำ!', 
                        html: 'บาร์โค้ดนี้ถูกใช้งานโดยรายการ<br><b class="text-rose-500">"' + duplicate[2] + '"</b> แล้ว', 
                        icon: 'error', 
                        customClass: { popup: '!rounded-[2rem] font-prompt' }
                    });
                    scannerMode = 'dispense';
                    return;
                }
                
                openBarcodeEditor(editTargetItem);
                setTimeout(() => {
                    document.getElementById('admin-barcode-input').value = newBarcode;
                }, 100);
                scannerMode = 'dispense'; 

            } else {
                if (scanCooldown) return; 
                scanCooldown = true;
                
                let barcode = decodedText.trim().toLowerCase();
                let foundItem = matStockData.find(r => (r[1]||'').toLowerCase() === barcode || (r[0]||'').toLowerCase() === barcode);
                
                if (foundItem) {
                    // 🟢 สแกนติด! สั่งให้มีเสียงและมือถือสั่น
                    beepSound.play().catch(e=>{});
                    if (navigator.vibrate) navigator.vibrate([100]); 
                    
                    let existingInCart = posCart.find(c => c.index === foundItem.originalIndex);
                    let cartQty = existingInCart ? existingInCart.qty : 0;
                    let max = parseFloat(foundItem[5]) || 0;
                    let remain = max - cartQty;

                    if(remain <= 0) {
                        if (isContinuousScanMode) {
                            showScannerToast('สต๊อกหมด! ไม่สามารถเบิกเพิ่มได้', 'error');
                            if (navigator.vibrate) navigator.vibrate([200, 100, 200]); // สั่นเตือน
                            setTimeout(() => { scanCooldown = false; }, 1500);
                        } else {
                            if (html5QrcodeScanner) html5QrcodeScanner.pause(true);
                            Swal.fire({
                                title: 'สต๊อกหมด!', text: 'ไม่สามารถเบิกวัสดุนี้เพิ่มได้แล้ว', icon: 'error',
                                confirmButtonText: 'รับทราบ', customClass: { popup: '!rounded-[2rem]' }
                            }).then(() => {
                                scanCooldown = false;
                                if (html5QrcodeScanner) html5QrcodeScanner.resume();
                            });
                        }
                        return;
                    }

                    if (isContinuousScanMode) {
                        // 🟢 [โหมดสแกนรัว] จับใส่ตะกร้า 1 ชิ้น โชว์แจ้งเตือน แล้วพร้อมสแกนต่อทันที
                        addToCartBulk(foundItem.originalIndex, foundItem[0], foundItem[1], foundItem[2], max, foundItem[6], parseFloat(foundItem[7]), 1);
                        
                        let updatedItem = posCart.find(c => c.index === foundItem.originalIndex);
                        showScannerToast(`เพิ่ม ${foundItem[2]} (${updatedItem.qty} ${foundItem[6]||''})`, 'success');
                        
                        // หยุดกล้องพักหายใจ 1.2 วินาที ป้องกันการยิงบาร์โค้ดเดิมเบิ้ลรัวๆ
                        if (html5QrcodeScanner) html5QrcodeScanner.pause(true);
                        setTimeout(() => { 
                            scanCooldown = false; 
                            if (html5QrcodeScanner) html5QrcodeScanner.resume(); 
                        }, 1200); 

                    } else {
                        // 🟢 [โหมดปกติ] หยุดกล้องแล้วเด้งหน้าต่างถามจำนวน
                        if (html5QrcodeScanner) html5QrcodeScanner.pause(true);

                        Swal.fire({
                            title: '<span class="text-xl font-black">พบวัสดุในคลัง</span>',
                            html: `
                                <div class="mt-2 text-center font-prompt">
                                    <h3 class="text-lg font-bold text-blue-600">${foundItem[2]}</h3>
                                    <p class="text-xs text-slate-400 uppercase tracking-widest mt-1 mb-4">รหัส: ${foundItem[1] || foundItem[0]}</p>
                                    
                                    <p class="text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2">ระบุจำนวนที่ต้องการเบิก (คงเหลือ ${remain} ${foundItem[6]||''})</p>
                                    
                                    <div class="flex items-center justify-center gap-4 bg-slate-50 py-3 px-6 rounded-[2rem] border border-slate-100 w-max mx-auto shadow-inner">
                                        <button type="button" onclick="adjustScanQty(-1, ${remain})" class="w-12 h-12 bg-white rounded-full shadow-sm text-rose-500 font-bold text-2xl flex items-center justify-center active:scale-95 focus:outline-none">-</button>
                                        <input type="number" id="scan-qty-input" value="1" min="1" max="${remain}" class="w-16 bg-transparent text-center text-3xl font-black text-slate-800 outline-none" readonly>
                                        <button type="button" onclick="adjustScanQty(1, ${remain})" class="w-12 h-12 bg-white rounded-full shadow-sm text-blue-600 font-bold text-2xl flex items-center justify-center active:scale-95 focus:outline-none">+</button>
                                    </div>
                                </div>
                            `,
                            showDenyButton: true,
                            showCancelButton: true,
                            confirmButtonText: 'หยิบใส่ตะกร้า (กลับหน้าหลัก)',
                            denyButtonText: 'หยิบใส่ตะกร้า (สแกนต่อ)',
                            cancelButtonText: 'ยกเลิก',
                            buttonsStyling: false,
                            customClass: {
                                popup: '!rounded-[2.5rem] w-[90vw] max-w-sm p-6 shadow-2xl',
                                actions: 'flex-col gap-2 w-full mt-6',
                                confirmButton: 'w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-2xl shadow-md transition-all',
                                denyButton: 'w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-3.5 rounded-2xl shadow-md transition-all',
                                cancelButton: 'w-full bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold py-3.5 rounded-2xl transition-all'
                            }
                        }).then((result) => {
                            if (result.isConfirmed || result.isDenied) {
                                let addQty = parseInt(document.getElementById('scan-qty-input').value) || 1;
                                addToCartBulk(foundItem.originalIndex, foundItem[0], foundItem[1], foundItem[2], max, foundItem[6], parseFloat(foundItem[7]), addQty);

                                if (result.isConfirmed) {
                                    closeScanner(); 
                                    scanCooldown = false;
                                } else if (result.isDenied) {
                                    scanCooldown = false;
                                    if (html5QrcodeScanner) html5QrcodeScanner.resume(); 
                                }
                            } else {
                                scanCooldown = false;
                                if (html5QrcodeScanner) html5QrcodeScanner.resume(); 
                            }
                        });
                    }

                } else {
                    if (isContinuousScanMode) {
                        // 🟢 ถ้าสแกนรัวแล้วของไม่ตรง ให้ขึ้นสีแดง
                        if (navigator.vibrate) navigator.vibrate([150, 100, 150]); 
                        showScannerToast('ไม่พบข้อมูลวัสดุนี้ในคลัง', 'error');
                        setTimeout(() => { scanCooldown = false; }, 1500);
                    } else {
                        if (html5QrcodeScanner) html5QrcodeScanner.pause(true);
                        Swal.fire({
                            title: '<span class="text-xl font-black text-rose-500">ไม่พบข้อมูล</span>', 
                            html: '<p class="text-slate-500 font-prompt">บาร์โค้ด <span class="font-bold text-slate-800">"'+ barcode +'"</span> ไม่มีในระบบคลังวัสดุครับ</p>', 
                            icon: 'warning',
                            confirmButtonText: 'ลองสแกนอีกครั้ง', confirmButtonColor: '#3b82f6', customClass: { popup: '!rounded-[2rem]' }
                        }).then(() => {
                            scanCooldown = false;
                            if (html5QrcodeScanner) html5QrcodeScanner.resume();
                        });
                    }
                }
            }
        }

        window.adjustScanQty = function(delta, max) {
            let input = document.getElementById('scan-qty-input');
            let val = parseInt(input.value) + delta;
            if (val < 1) val = 1;
            if (val > max) val = max;
            input.value = val;
        }

        window.addToCartBulk = function(index, code, barcode, name, maxQty, unit, price, addQty) {
            let existing = posCart.find(c => c.index === index);
            if (existing) {
                existing.qty += addQty;
                if (existing.qty > maxQty) existing.qty = maxQty;
            } else {
                posCart.push({ index, code, barcode, name, maxQty, qty: addQty, unit, price });
            }
            renderPOSCart();
            renderPOSProducts();
        }

        let loaderInterval;
        function showGlobalLoading(title = 'LOADING....', desc = '') {
            const loader = document.getElementById('modern-loader');
            const bar = document.getElementById('loader-progress-bar');
            document.getElementById('loader-title').innerText = title;
            document.getElementById('loader-desc').innerText = desc;
            
            if(loader) {
                loader.classList.remove('hidden');
                loader.style.display = 'flex'; 
                void loader.offsetWidth; 
                loader.classList.remove('opacity-0');
            }
            
            if(bar) {
                bar.style.width = '0%';
                bar.style.transitionDuration = '0ms'; 
                clearInterval(loaderInterval);
                let progress = 0;
                
                setTimeout(() => {
                    bar.style.transitionDuration = '300ms';
                    loaderInterval = setInterval(() => {
                        if(progress < 90) {
                            progress += Math.random() * 8 + 2; 
                            if(progress > 90) progress = 90;
                            bar.style.width = progress + '%';
                        }
                    }, 250);
                }, 50);
            }
        }
        function hideGlobalLoading() {
            const loader = document.getElementById('modern-loader');
            const bar = document.getElementById('loader-progress-bar');
            if(bar) { clearInterval(loaderInterval); bar.style.width = '100%'; }
            setTimeout(() => {
                if(loader) loader.classList.add('opacity-0');
                setTimeout(() => {
                    if(loader) { loader.classList.add('hidden'); loader.style.display = 'none'; }
                }, 300);
            }, 400); 
        }

        window.submitPOS = function() {
            let ref = document.getElementById('pos-ref').value.trim();
            if(!ref) {
                Swal.fire({title: 'ข้อมูลไม่ครบ', text: 'ชื่อผู้เบิกจะถูกใส่ให้อัตโนมัติจาก LINE (หากไม่มี โปรดตรวจสอบการล็อกอิน)', icon: 'warning', confirmButtonColor: '#3b82f6', customClass:{popup:'!rounded-[2rem]'}});
                return;
            }

            let rawDate = document.getElementById('pos-date').value;
            let finalSaveDate = '';
            if(rawDate) {
                let dParts = rawDate.split('-'); 
                let y = parseInt(dParts[0]); if(y < 2500) y += 543; 
                finalSaveDate = dParts[2] + '/' + dParts[1] + '/' + y;
            }
            let remark = document.getElementById('pos-remark').value.trim();

            showGlobalLoading('กำลังบันทึกข้อมูล...', 'ระบบกำลังตัดสต๊อกและอัปเดตฐานข้อมูล');

            let payloadData = {
                date: finalSaveDate,
                ref: ref,
                remark: remark,
                items: posCart.map(c => ({ 
                    code: c.code, 
                    barcode: c.barcode, 
                    name: c.name, 
                    qty: c.qty, 
                    unit: c.unit, 
                    price: c.price 
                }))
            };

            let requestBody = {
                action: 'dispenseMaterial',
                data: JSON.stringify(payloadData) 
            };

            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(requestBody)
            }).then(r => r.json()).then(res => {
                hideGlobalLoading();
                if (res.status === 'success') {
                    
                    if ('speechSynthesis' in window) {
                        let speech = new SpeechSynthesisUtterance("บันทึกรายการเบิกวัสดุสำเร็จค่ะ");
                        speech.lang = 'th-TH'; 
                        speech.rate = 1.0;     
                        speech.pitch = 1.0;    
                        window.speechSynthesis.speak(speech);
                    } else {
                        beepSound.play().catch(e=>{});
                    }

                    let countdown = 10;
                    let timerInterval;

                    Swal.fire({ 
                        html: `
                            <div class="mt-4 font-prompt">
                                <div class="w-24 h-24 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-5 relative shadow-inner">
                                    <svg class="w-10 h-10 text-emerald-500 absolute z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                                    <div class="absolute inset-0 border-[5px] border-emerald-100 border-t-emerald-500 rounded-full animate-spin"></div>
                                </div>
                                <h2 class="text-2xl font-black text-slate-800 mb-2">บันทึกสำเร็จ!</h2>
                                <p class="text-slate-500 text-sm font-medium mb-5">ระบบกำลังปิดหน้าต่างอัตโนมัติใน <b id="close-countdown" class="text-rose-500 text-lg tabular-nums">10</b> วินาที</p>
                                
                                <div class="w-full bg-slate-100 rounded-full h-2 mb-2 overflow-hidden shadow-inner">
                                    <div id="close-progress" class="bg-gradient-to-r from-emerald-400 to-emerald-500 h-2 rounded-full" style="width: 100%; transition: width 1s linear;"></div>
                                </div>
                            </div>
                        `,
                        showConfirmButton: false, 
                        allowOutsideClick: false, 
                        timer: 10000, 
                        customClass: { popup: '!rounded-[2.5rem] p-6 shadow-2xl' },
                        didOpen: () => {
                            const countEl = document.getElementById('close-countdown');
                            const progEl = document.getElementById('close-progress');
                            timerInterval = setInterval(() => {
                                countdown--;
                                if (countEl) countEl.innerText = countdown;
                                if (progEl) progEl.style.width = (countdown * 10) + '%';
                            }, 1000);
                        },
                        willClose: () => {
                            clearInterval(timerInterval);
                        }
                    }).then(() => {
                        if (liff.isInClient()) {
                            liff.closeWindow();
                        } else {
                            window.close();
                            document.body.innerHTML = `
                                <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; background-color: #f8fafc; font-family: 'Prompt', sans-serif;">
                                    <div style="width:80px; height:80px; background:#d1fae5; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:20px; box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.06);">
                                        <svg style="width:40px; height:40px; color:#10b981;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                                    </div>
                                    <h2 style="font-size:24px; color:#1e293b; font-weight:900; margin-bottom:10px;">ทำรายการเสร็จสิ้น</h2>
                                    <p style="color:#64748b; font-weight:500;">คุณสามารถกด (X) ปิดหน้าต่างนี้ได้เลยครับ</p>
                                </div>
                            `;
                        }
                    });
                    
                    posCart = [];
                    document.getElementById('pos-remark').value = '';
                    toggleCartModal(false);

                } else {
                    Swal.fire({ title:'เกิดข้อผิดพลาด', text: res.message || 'ไม่ทราบสาเหตุจากเซิร์ฟเวอร์', icon:'error', customClass:{popup:'!rounded-3xl'} });

            }).catch(e => {
                hideGlobalLoading();
                Swal.fire({ title:'เกิดข้อผิดพลาด', text: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ (' + e.message + ')', icon:'error', customClass:{popup:'!rounded-3xl'} });

        window.toggleAdminMode = function() {
            Swal.close();
            if (isAdminMode) {
                // ปิดโหมดแอดมิน
                isAdminMode = false;
                scannerMode = 'dispense';
                document.getElementById('main-header').classList.replace('bg-slate-900', 'bg-white/90');
                document.getElementById('header-title').classList.replace('text-white', 'text-slate-800');

                document.getElementById('floating-cart-btn').style.display = 'flex'; // โชว์ตะกร้า
                Swal.fire({ title: 'เข้าสู่โหมดเบิกจ่าย', icon: 'success', timer: 1000, showConfirmButton: false });
                renderPOSProducts();
            } else {
                // 🟢 ตรวจสอบสิทธิ์เบื้องต้น
                if (userAccessRight.includes('all') || userAccessRight.includes('view-material')) {
                    activateAdminMode();
