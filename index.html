<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบเบิกจ่ายวัสดุ (Mobile Scanner)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- ไลบรารีอ่านบาร์โค้ด -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { display: none; } /* ซ่อน Scrollbar บนมือถือให้ดูคลีน */
        
        /* ตกแต่งกล้องสแกนเนอร์ */
        #reader { border: none !important; border-radius: 1.5rem; overflow: hidden; background: #0f172a; width: 100%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        #reader video { object-fit: cover; border-radius: 1.5rem; }
        #reader__dashboard_section_csr span, #reader__dashboard_section_csr button { color: #fff !important; }
    </style>
</head>
<body class="text-slate-800 h-[100dvh] overflow-hidden flex flex-col bg-slate-50">

    <!-- 🌟 ส่วนหัว (Header) -->
    <div class="px-5 py-4 bg-white/90 backdrop-blur-xl flex justify-between items-center shrink-0 z-10 border-b border-slate-100 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>
            </div>
            <div>
                <h1 class="text-base font-black text-slate-800 leading-tight">ระบบเบิกจ่ายวัสดุ</h1>
                <div id="status-indicator" class="text-[10px] font-bold text-amber-500 flex items-center gap-1">
                    <div class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></div> กำลังเชื่อมต่อ...
                </div>
            </div>
        </div>
    </div>

    <!-- 🌟 พื้นที่หลัก (เครื่องมือ + รายการวัสดุ) -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
        
        <!-- แถบเครื่องมือค้นหา และปุ่มสแกน -->
        <div class="px-5 py-4 bg-white shrink-0 z-10 shadow-[0_10px_20px_-15px_rgba(0,0,0,0.05)] space-y-3">
            <div class="flex gap-2">
                <div class="flex-1 relative group">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    </div>
                    <input type="text" id="pos-search" oninput="window.posSearchTerm = this.value.toLowerCase(); renderPOSProducts();" placeholder="ค้นหาชื่อ, บาร์โค้ด..." class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-blue-400 focus:bg-white transition-all font-bold text-slate-700">
                </div>
                <select id="pos-cat" onchange="window.posCategory = this.value; renderPOSProducts();" class="w-32 px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-blue-400 focus:bg-white font-bold text-slate-700 truncate">
                    <option value="all">ทุกหมวดหมู่</option>
                </select>
            </div>
            <button onclick="openScanner()" class="w-full py-3 bg-slate-800 text-white font-bold text-sm rounded-xl shadow-md active:scale-95 transition-all flex items-center justify-center gap-2">
                <svg class="w-5 h-5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
                เปิดสแกนเนอร์
            </button>
        </div>
        
        <!-- Grid สินค้า (เว้นที่ว่างด้านล่างเผื่อแถบตะกร้า) -->
        <div id="pos-product-grid" class="flex-1 overflow-y-auto p-4 pb-28 custom-scrollbar grid grid-cols-2 md:grid-cols-3 gap-3 content-start"></div>
    </div>

    <!-- 🌟 แถบตะกร้าสินค้า (Floating Bottom Bar) -->
    <div class="fixed bottom-0 left-0 w-full p-4 z-40 bg-gradient-to-t from-white via-white to-transparent pointer-events-none pb-6">
        <button onclick="toggleCartModal(true)" id="floating-cart-btn" disabled class="w-full py-4 bg-slate-200 text-slate-400 font-black text-sm rounded-2xl shadow-lg transition-all flex justify-between items-center px-6 pointer-events-auto active:scale-95">
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
                ดูตะกร้าเบิกจ่าย
            </div>
            <div id="floating-cart-badge" class="bg-slate-300 text-white px-3 py-1 rounded-lg text-xs hidden">0 รายการ</div>
        </button>
    </div>

    <!-- 🌟 หน้าต่างจัดการตะกร้า และยืนยันเบิก (Slide-up Modal) -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-slate-50 flex flex-col transform translate-y-full transition-transform duration-300 ease-in-out">
        
        <!-- Header ของ Modal -->
        <div class="bg-white px-4 py-4 flex justify-between items-center shadow-sm z-10 shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="toggleCartModal(false)" class="w-10 h-10 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center active:bg-slate-200 transition-colors">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" /></svg>
                </button>
                <h2 class="text-lg font-black text-slate-800">ตะกร้าของคุณ</h2>
            </div>
            <span id="modal-cart-count" class="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg text-xs font-black">0 รายการ</span>
        </div>

        <!-- รายการสินค้า และ ฟอร์ม -->
        <div class="flex-1 overflow-y-auto p-4 custom-scrollbar pb-32">
            
            <div id="pos-cart-items" class="flex flex-col gap-3 mb-6"></div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h3 class="text-sm font-black text-slate-700 border-b border-slate-100 pb-2">ข้อมูลอ้างอิง</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">วันที่ทำรายการ</label>
                        <input type="date" id="pos-date" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700 outline-none focus:border-blue-400 focus:bg-white">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">อ้างอิงผู้เบิก <span class="text-rose-500">*</span></label>
                        <input type="text" id="pos-ref" list="reqList" placeholder="พิมพ์ชื่อ..." class="w-full px-3 py-2.5 bg-blue-50/50 border border-blue-200 rounded-xl text-xs font-bold text-blue-800 outline-none focus:border-blue-500 focus:bg-white">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">หมายเหตุ (ถ้ามี)</label>
                    <input type="text" id="pos-remark" placeholder="เช่น ใช้สำหรับงานประชุม..." class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-blue-400 text-slate-700">
                </div>
            </div>
        </div>

        <!-- ปุ่มยืนยัน (Sticky ด้านล่างใน Modal) -->
        <div class="absolute bottom-0 w-full bg-white p-5 border-t border-slate-100 z-20 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] pb-8">
            <button type="button" onclick="submitPOS()" class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 active:scale-95 text-white font-black text-sm rounded-2xl shadow-lg shadow-blue-500/30 transition-all flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" /></svg>
                ยืนยันการตัดสต๊อก
            </button>
        </div>
    </div>
    <datalist id="reqList"></datalist>

    <!-- 🌟 Overlay สำหรับเปิดกล้องสแกน -->
    <div id="scanner-overlay" class="hidden fixed inset-0 z-[100] bg-slate-900/95 backdrop-blur-sm flex flex-col">
        <div class="p-5 flex justify-between items-center text-white shrink-0">
            <h3 class="text-lg font-black flex items-center gap-2"><svg class="w-6 h-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg> สแกนบาร์โค้ด</h3>
            <button onclick="closeScanner()" class="w-10 h-10 bg-white/20 active:bg-rose-500 rounded-full flex items-center justify-center transition-colors">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="flex-1 flex flex-col items-center justify-center p-4">
            <div id="reader"></div>
            <p class="text-slate-400 text-sm mt-6 text-center">หันกล้องไปที่บาร์โค้ดของวัสดุเพื่อหยิบใส่ตะกร้า</p>
        </div>
        
        <div id="scan-toast" class="absolute bottom-10 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-white px-6 py-3 rounded-full font-bold shadow-lg transition-all duration-300 opacity-0 translate-y-10 pointer-events-none flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
            <span id="scan-toast-text"></span>
        </div>
    </div>

    <!-- 🟢 Modern Global Loading Overlay (แบบเว็บหลัก) -->
    <div id="modern-loader" class="fixed inset-0 z-[99999] flex-col items-center justify-center bg-[#050814]/80 backdrop-blur-xl transition-opacity duration-300 opacity-0 hidden">
        <div class="w-full max-w-sm px-8 flex flex-col items-center transform transition-transform duration-300 scale-95" id="modern-loader-box">
            <h3 id="loader-title" class="text-white font-light tracking-[0.2em] text-sm mb-3">LOADING....</h3>
            <div class="w-full h-5 rounded-full border border-blue-500/50 p-[3px] bg-[#02040a] overflow-hidden shadow-[0_0_15px_rgba(59,130,246,0.3)]">
                <div id="loader-progress-bar" class="h-full rounded-full bg-gradient-to-r from-blue-600 via-purple-500 to-fuchsia-500 w-[0%] transition-all duration-200 ease-out shadow-[0_0_10px_rgba(217,70,239,0.8)]"></div>
            </div>
            <p id="loader-desc" class="text-slate-400 text-[10px] mt-4 font-light tracking-wide text-center"></p>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚨 นำ Web App URL ของ Google Apps Script มาใส่ตรงนี้
        // ==========================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz_FvpCG7ZHmnfNtiBpAfvE-wlr80TadtEGUJfZjk2Kx2kLzEfDW0wSNRIVHWpGtnO_/exec"; 
        
        let matStockData = [];
        let posCart = [];
        let html5QrcodeScanner;
        let posSearchTerm = '';
        let posCategory = 'all';

        const beepSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

        window.onload = function() {
            let ts = new Date();
            document.getElementById('pos-date').value = ts.getFullYear() + "-" + String(ts.getMonth() + 1).padStart(2, '0') + "-" + String(ts.getDate()).padStart(2, '0');
            fetchStockData();
        };

        // 🟢 ควบคุม Modal ตะกร้า
        window.toggleCartModal = function(show) {
            const modal = document.getElementById('cart-modal');
            if (show) {
                if(posCart.length === 0) {
                    Swal.fire({ title: 'ตะกร้าว่างเปล่า', text: 'กรุณาเลือกวัสดุก่อนครับ', icon: 'info', confirmButtonColor: '#3b82f6', customClass: { popup: '!rounded-3xl' } });
                    return;
                }
                modal.classList.remove('translate-y-full');
            } else {
                modal.classList.add('translate-y-full');
            }
        };

        // 🟢 ดึงข้อมูล 
        function fetchStockData() {
            if (GAS_URL === "YOUR_WEB_APP_URL_HERE") return;

            fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'fetchMaterialOnly' }) })
            .then(r => r.json())
            .then(result => {
                if (result.status === 'success') {
                    matStockData = result.matStockData || [];
                    let matHistoryData = result.matHistoryData || [];
                    matStockData.forEach((row, idx) => { row.originalIndex = idx + 1; });

                    let cats = [...new Set(matStockData.map(r => String(r[4]||'').trim()).filter(c => c))].sort();
                    document.getElementById('pos-cat').innerHTML = '<option value="all">ทุกหมวดหมู่</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');

                    let requesters = [...new Set(matHistoryData.filter(h => h[2] === "เบิกจ่าย (ตัดสต๊อก)").map(h => String(h[3]||'').trim()).filter(r => r && r !== '-'))].sort();
                    document.getElementById('reqList').innerHTML = requesters.map(r => `<option value="${r}">`).join('');

                    let statusEl = document.getElementById('status-indicator');
                    statusEl.className = 'text-[10px] font-bold text-emerald-600 flex items-center gap-1';
                    statusEl.innerHTML = '<div class="w-2 h-2 rounded-full bg-emerald-500"></div> ออนไลน์';

                    renderPOSProducts();
                    renderPOSCart();
                }
            }).catch(e => {
                document.getElementById('status-indicator').innerHTML = '<span class="text-rose-500">❌ ออฟไลน์</span>';
            });
        }

        // 🟢 เรนเดอร์การ์ด (Square)
        const getCategoryTheme = (category) => {
            if (category.includes('คอมพิวเตอร์') || category.includes('ไอที')) return { border: 'from-blue-600 to-indigo-500', text: 'text-indigo-600', badge: 'from-blue-500 to-indigo-500' };
            if (category.includes('สำนักงาน') || category.includes('กระดาษ')) return { border: 'from-emerald-400 to-teal-500', text: 'text-teal-600', badge: 'from-emerald-400 to-teal-500' };
            if (category.includes('บ้าน') || category.includes('ครัว')) return { border: 'from-amber-400 to-orange-500', text: 'text-orange-600', badge: 'from-amber-400 to-orange-500' };
            if (category.includes('แพทย์') || category.includes('ยา')) return { border: 'from-cyan-400 to-blue-500', text: 'text-cyan-600', badge: 'from-cyan-400 to-blue-500' };
            return { border: 'from-indigo-400 to-blue-500', text: 'text-indigo-600', badge: 'from-indigo-400 to-blue-500' };
        };

        window.renderPOSProducts = function() {
            let container = document.getElementById('pos-product-grid');
            if(!matStockData.length) return;

            let filtered = matStockData.filter(row => {
                let qty = parseFloat(row[5]) || 0;
                if (qty <= 0) return false; 
                let matchSearch = posSearchTerm === '' || (row[1]||'').toLowerCase().includes(posSearchTerm) || (row[2]||'').toLowerCase().includes(posSearchTerm);
                let matchCat = posCategory === 'all' || (row[4]||'') === posCategory;
                return matchSearch && matchCat;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="col-span-full py-10 text-center text-slate-400 font-bold">ไม่พบวัสดุที่ค้นหา</div>';
                return;
            }

            let html = '';
            filtered.forEach(row => {
                let code = row[0], barcode = row[1] || '', name = row[2] || '', cat = row[4] || '-', loc = row[9] || '-';
                let qty = parseFloat(row[5]) || 0, unit = row[6] || '', price = parseFloat(row[7]) || 0;
                
                let theme = getCategoryTheme(cat);
                let imgs = []; try { imgs = JSON.parse(row[11] || '[]'); } catch(e){}
                let imgUrl = imgs.length > 0 ? 'https://drive.google.com/thumbnail?id=' + imgs[0] + '&sz=w300' : '';
                
                let imgTag = imgUrl ? `<img src="${imgUrl}" class="w-full h-full object-contain p-1 mix-blend-multiply">` : `<div class="w-full h-full flex items-center justify-center text-slate-300"><svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></div>`;

                let inCart = posCart.find(c => c.index === row.originalIndex);
                let cartQty = inCart ? inCart.qty : 0;
                let remain = qty - cartQty;
                let isDisable = remain <= 0;

                let safeName = name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                let actionCall = isDisable ? '' : `addToCart(${row.originalIndex}, '${code}', '${barcode}', '${safeName}', ${qty}, '${unit}', ${price})`;

                html += `
                <div class="relative w-full aspect-square rounded-2xl bg-gradient-to-br ${theme.border} p-[2px] shadow-sm active:scale-95 transition-all ${isDisable ? 'opacity-50 grayscale' : 'cursor-pointer'}" onclick="${actionCall}">
                    <div class="w-full h-full bg-white rounded-[calc(1rem-2px)] flex flex-col overflow-hidden relative">
                        ${cartQty > 0 ? `<div class="absolute top-1.5 right-1.5 bg-rose-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-black shadow-md z-10 border-2 border-white">${cartQty}</div>` : ''}
                        
                        <div class="flex-1 min-h-0 w-full bg-white flex items-center justify-center p-2">${imgTag}</div>
                        
                        <div class="flex justify-between items-center px-2 py-1.5 gap-1 shrink-0">
                            <h4 class="text-[11px] font-black text-slate-800 truncate flex-1">${name}</h4>
                            <div class="bg-gradient-to-r ${theme.badge} text-white rounded px-1.5 py-0.5 flex items-baseline gap-0.5 shrink-0">
                                <span class="text-sm font-black leading-none">${remain}</span>
                                <span class="text-[8px] font-bold leading-none">${unit}</span>
                            </div>
                        </div>
                        
                        <div class="border-t border-slate-100 flex justify-between items-center px-2 py-1.5 shrink-0">
                            <span class="text-[8px] font-black ${theme.text} truncate pr-1">${cat}</span>
                            <span class="text-[8px] font-black ${theme.text} shrink-0">${loc}</span>
                        </div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        // 🟢 ระบบจัดการตะกร้า 
        window.addToCart = function(index, code, barcode, name, maxQty, unit, price) {
            let existing = posCart.find(c => c.index === index);
            if (existing) {
                if (existing.qty < maxQty) existing.qty++;
            } else {
                posCart.push({ index, code, barcode, name, maxQty, qty: 1, unit, price });
            }
            renderPOSCart();
            renderPOSProducts();
        }

        window.updateCartQty = function(cartIdx, delta) {
            let item = posCart[cartIdx];
            if(!item) return;
            item.qty += delta;
            if (item.qty <= 0) posCart.splice(cartIdx, 1);
            else if (item.qty > item.maxQty) item.qty = item.maxQty;
            renderPOSCart();
            renderPOSProducts();
            
            if(posCart.length === 0) toggleCartModal(false); // ปิด modal ถ้าของหมด
        }

        window.removeFromCart = function(cartIdx) {
            posCart.splice(cartIdx, 1);
            renderPOSCart();
            renderPOSProducts();
            if(posCart.length === 0) toggleCartModal(false);
        }

        window.renderPOSCart = function() {
            let container = document.getElementById('pos-cart-items');
            let mainBtn = document.getElementById('floating-cart-btn');
            let mainBadge = document.getElementById('floating-cart-badge');
            
            document.getElementById('modal-cart-count').innerText = posCart.length + " รายการ";

            if (posCart.length === 0) {
                container.innerHTML = '<div class="py-10 text-center text-slate-400 font-bold">ตะกร้าว่างเปล่า</div>';
                
                mainBtn.disabled = true;
                mainBtn.className = "w-full py-4 bg-slate-200 text-slate-400 font-black text-sm rounded-2xl shadow-sm transition-all flex justify-between items-center px-6 pointer-events-none";
                mainBadge.classList.add('hidden');
                return;
            }

            // ปุ่มลอยด้านล่างหน้าหลัก
            mainBtn.disabled = false;
            mainBtn.className = "w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-black text-sm rounded-2xl shadow-[0_10px_20px_rgba(37,99,235,0.3)] transition-all flex justify-between items-center px-6 pointer-events-auto active:scale-95";
            mainBadge.classList.remove('hidden', 'bg-slate-300', 'text-white');
            mainBadge.classList.add('bg-white', 'text-blue-600');
            mainBadge.innerText = posCart.length + " รายการ";

            // รายการใน Modal (เพิ่มแสดง "หน่วย")
            let html = '';
            posCart.forEach((item, idx) => {
                html += `
                <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between gap-2">
                    <div class="flex-1 min-w-0 pr-1">
                        <p class="text-[9px] font-black text-blue-500 tracking-widest truncate uppercase">${item.barcode || item.code}</p>
                        <h4 class="text-xs font-black text-slate-800 truncate">${item.name}</h4>
                    </div>
                    
                    <div class="flex flex-col items-end gap-1 shrink-0">
                        <div class="flex items-center bg-slate-50 border border-slate-100 rounded-full p-0.5">
                            <button onclick="updateCartQty(${idx}, -1)" class="w-6 h-6 flex items-center justify-center rounded-full bg-white text-slate-500 shadow-sm active:bg-rose-50"><svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M20 12H4"/></svg></button>
                            <div class="flex items-baseline gap-1 w-10 justify-center">
                                <span class="text-xs font-black text-slate-800 tabular-nums">${item.qty}</span>
                            </div>
                            <button onclick="updateCartQty(${idx}, 1)" class="w-6 h-6 flex items-center justify-center rounded-full bg-white text-blue-600 shadow-sm active:bg-blue-50"><svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"/></svg></button>
                        </div>
                        <span class="text-[9px] font-bold text-slate-400 mr-1">${item.unit}</span>
                    </div>

                    <button onclick="removeFromCart(${idx})" class="w-8 h-8 shrink-0 flex items-center justify-center text-rose-400 bg-rose-50 rounded-full ml-1 active:bg-rose-100"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
                </div>`;
            });
            container.innerHTML = html;
        }

        // 🟢 ระบบสแกนกล้อง
        function openScanner() {
            document.getElementById('scanner-overlay').classList.remove('hidden');
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
                fps: 10, qrbox: {width: 250, height: 100}, aspectRatio: 1.0, showTorchButtonIfSupported: true
            }, false);
            html5QrcodeScanner.render(onScanSuccess);
        }
        function closeScanner() {
            document.getElementById('scanner-overlay').classList.add('hidden');
            if (html5QrcodeScanner) html5QrcodeScanner.clear();
        }

        let scanCooldown = false;
        function onScanSuccess(decodedText) {
            if (scanCooldown) return; 
            let barcode = decodedText.trim().toLowerCase();
            let foundItem = matStockData.find(r => (r[1]||'').toLowerCase() === barcode || (r[0]||'').toLowerCase() === barcode);
            
            if (foundItem) {
                let existingInCart = posCart.find(c => c.index === foundItem.originalIndex);
                let cartQty = existingInCart ? existingInCart.qty : 0;
                let remain = (parseFloat(foundItem[5]) || 0) - cartQty;

                if (remain > 0) {
                    beepSound.play().catch(e=>{});
                    addToCart(foundItem.originalIndex, foundItem[0], foundItem[1], foundItem[2], parseFloat(foundItem[5]), foundItem[6], parseFloat(foundItem[7]));
                    
                    let toast = document.getElementById('scan-toast');
                    document.getElementById('scan-toast-text').innerText = `หยิบ ${foundItem[2]} แล้ว`;
                    toast.classList.remove('opacity-0', 'translate-y-10');
                    setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-10'); }, 1500);
                }
            }
            scanCooldown = true;
            setTimeout(() => { scanCooldown = false; }, 1500);
        }

        // 🟢 ฟังก์ชัน Loading แบบสวยๆ
        let loaderInterval;
        function showGlobalLoading(title = 'LOADING....', desc = '') {
            const loader = document.getElementById('modern-loader');
            const bar = document.getElementById('loader-progress-bar');
            document.getElementById('loader-title').innerText = title;
            document.getElementById('loader-desc').innerText = desc;
            
            if(loader) {
                loader.classList.remove('hidden');
                loader.style.display = 'flex'; 
                void loader.offsetWidth; 
                loader.classList.remove('opacity-0');
            }
            
            if(bar) {
                bar.style.width = '0%';
                bar.style.transitionDuration = '0ms'; 
                clearInterval(loaderInterval);
                let progress = 0;
                
                setTimeout(() => {
                    bar.style.transitionDuration = '300ms';
                    loaderInterval = setInterval(() => {
                        if(progress < 90) {
                            progress += Math.random() * 8 + 2; 
                            if(progress > 90) progress = 90;
                            bar.style.width = progress + '%';
                        }
                    }, 250);
                }, 50);
            }
        }
        function hideGlobalLoading() {
            const loader = document.getElementById('modern-loader');
            const bar = document.getElementById('loader-progress-bar');
            if(bar) { clearInterval(loaderInterval); bar.style.width = '100%'; }
            setTimeout(() => {
                if(loader) loader.classList.add('opacity-0');
                setTimeout(() => {
                    if(loader) { loader.classList.add('hidden'); loader.style.display = 'none'; }
                }, 300);
            }, 400); 
        }

        // 🟢 ยืนยันการตัดจ่าย
        window.submitPOS = function() {
            let ref = document.getElementById('pos-ref').value.trim();
            if(!ref) {
                Swal.fire({title: 'ข้อมูลไม่ครบ', text: 'กรุณาระบุ ชื่อผู้เบิก / อ้างอิง', icon: 'warning', confirmButtonColor: '#3b82f6', customClass:{popup:'!rounded-3xl'}});
                return;
            }

            let rawDate = document.getElementById('pos-date').value;
            let finalSaveDate = '';
            if(rawDate) {
                let dParts = rawDate.split('-'); 
                let y = parseInt(dParts[0]); if(y < 2500) y += 543; 
                finalSaveDate = dParts[2] + '/' + dParts[1] + '/' + y;
            }
            let remark = document.getElementById('pos-remark').value.trim();

            showGlobalLoading('กำลังบันทึกข้อมูล...', 'ระบบกำลังตัดสต๊อกและอัปเดตฐานข้อมูล');

            let payload = {
                action: 'dispenseMaterial',
                date: finalSaveDate,
                ref: ref,
                remark: remark,
                items: posCart.map(c => ({ code: c.code, barcode: c.barcode, name: c.name, qty: c.qty, unit: c.unit, price: c.price }))
            };

            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            }).then(r => r.json()).then(res => {
                hideGlobalLoading();
                if (res.status === 'success') {
                    // แสดงหน้าต่างสำเร็จแบบสวยๆ
                    Swal.fire({ 
                        html: '<div class="mt-4"><div class="w-20 h-20 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-4"><svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg></div><h2 class="text-2xl font-black text-slate-800 mb-2">บันทึกสำเร็จ!</h2><p class="text-slate-500 text-sm font-medium">ทำรายการเบิกวัสดุเรียบร้อยแล้ว</p></div>',
                        showConfirmButton: false, timer: 2000,
                        customClass:{popup:'!rounded-[2rem]'} 
                    });
                    
                    posCart = [];
                    document.getElementById('pos-ref').value = '';
                    document.getElementById('pos-remark').value = '';
                    toggleCartModal(false);
                    fetchStockData();
                } else {
                    Swal.fire({ title:'เกิดข้อผิดพลาด', text: res.message, icon:'error', customClass:{popup:'!rounded-3xl'} });
                }
            }).catch(e => {
                hideGlobalLoading();
                Swal.fire({ title:'เกิดข้อผิดพลาด', text: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', icon:'error', customClass:{popup:'!rounded-3xl'} });
            });
        }
    </script>
</body>
</html>
