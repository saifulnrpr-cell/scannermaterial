<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบเบิกจ่ายวัสดุ (POS & Scanner)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- ไลบรารีอ่านบาร์โค้ด -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* ตกแต่งกล้องสแกนเนอร์ */
        #reader { border: none !important; border-radius: 1.5rem; overflow: hidden; background: #0f172a; width: 100%; max-width: 500px; margin: 0 auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        #reader video { object-fit: cover; border-radius: 1.5rem; }
        #reader__dashboard_section_csr span, #reader__dashboard_section_csr button { color: #fff !important; }
    </style>
</head>
<body class="text-slate-800 h-screen overflow-hidden flex flex-col lg:flex-row bg-gradient-to-br from-slate-50 to-blue-50/50">

    <!-- 🌟 ฝั่งซ้าย: โซนเลือกวัสดุ และปุ่มสแกน -->
    <div class="flex-[2.5] flex flex-col h-[60vh] lg:h-full overflow-hidden relative">
        
        <!-- แถบเครื่องมือด้านบน -->
        <div class="px-4 py-4 lg:px-8 lg:py-5 bg-white/80 backdrop-blur-xl flex flex-wrap gap-3 items-center shrink-0 z-10 border-b border-white/50 shadow-sm">
            
            <div class="flex items-center gap-3 w-full lg:w-auto mb-2 lg:mb-0">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>
                </div>
                <div>
                    <h1 class="text-lg font-black text-slate-800 leading-tight">ระบบเบิกจ่ายวัสดุ</h1>
                    <div id="status-indicator" class="text-[10px] font-bold text-amber-500 flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></div> กำลังเชื่อมต่อ...</div>
                </div>
            </div>

            <!-- ค้นหา & หมวดหมู่ -->
            <div class="flex-1 flex gap-2 w-full lg:w-auto">
                <div class="flex-1 relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-4 h-4 text-slate-400 group-focus-within:text-blue-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    </div>
                    <input type="text" id="pos-search" oninput="window.posSearchTerm = this.value.toLowerCase(); renderPOSProducts();" placeholder="ค้นหาชื่อ, บาร์โค้ด..." class="w-full pl-10 pr-3 py-2.5 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-500/10 shadow-sm transition-all font-medium text-slate-700">
                </div>
                <select id="pos-cat" onchange="window.posCategory = this.value; renderPOSProducts();" class="w-32 lg:w-40 px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-500/10 shadow-sm cursor-pointer font-medium text-slate-700 transition-all truncate">
                    <option value="all">ทุกหมวดหมู่</option>
                </select>
            </div>

            <!-- ปุ่มเปิดกล้องสแกน -->
            <button onclick="openScanner()" class="w-full lg:w-auto px-5 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl shadow-lg shadow-slate-800/20 transition-all flex items-center justify-center gap-2 active:scale-95">
                <svg class="w-5 h-5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
                เปิดสแกนเนอร์
            </button>
        </div>
        
        <!-- Grid สินค้า (การ์ดสี่เหลี่ยม) -->
        <div id="pos-product-grid" class="flex-1 overflow-y-auto p-4 lg:p-6 custom-scrollbar grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4 lg:gap-5 content-start"></div>
    </div>

    <!-- 🌟 ฝั่งขวา (หรือด้านล่างในมือถือ): โซนตะกร้าเบิกจ่าย -->
    <div class="flex-[1] flex flex-col h-[40vh] lg:h-full bg-white shadow-[-15px_0_30px_-15px_rgba(0,0,0,0.1)] overflow-hidden shrink-0 relative z-20 min-w-[320px] lg:max-w-[420px] border-t lg:border-t-0 lg:border-l border-slate-200/60 rounded-t-[2rem] lg:rounded-t-none">
        
        <div class="px-6 py-4 lg:py-5 border-b border-slate-100 flex justify-between items-center shrink-0">
            <h3 class="font-black text-slate-800 text-lg flex items-center gap-2">ตะกร้าเบิกจ่าย</h3>
            <span id="pos-cart-count" class="bg-blue-50 text-blue-600 px-3 py-1 rounded-lg text-xs font-black">0 รายการ</span>
        </div>

        <div id="pos-cart-items" class="flex-1 overflow-y-auto px-4 py-3 custom-scrollbar flex flex-col gap-3 bg-slate-50/30"></div>

        <div class="p-5 bg-white border-t border-slate-100 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)] shrink-0 space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">วันที่</label>
                    <input type="date" id="pos-date" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700 outline-none focus:border-blue-400 focus:bg-white transition-colors">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">อ้างอิงผู้เบิก <span class="text-rose-500">*</span></label>
                    <input type="text" id="pos-ref" list="reqList" placeholder="ระบุชื่อผู้เบิก..." class="w-full px-3 py-2 bg-blue-50/50 border border-blue-200 rounded-xl text-xs font-bold text-blue-800 outline-none focus:border-blue-400 focus:bg-white transition-colors">
                </div>
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block">หมายเหตุ (ถ้ามี)</label>
                <input type="text" id="pos-remark" placeholder="เช่น ใช้สำหรับงานประชุม..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-blue-400 focus:bg-white transition-colors text-slate-700">
            </div>
            <button type="button" onclick="submitPOS()" id="checkout-btn" disabled class="w-full py-3.5 bg-slate-200 text-slate-400 font-black text-sm rounded-xl transition-all duration-300 flex items-center justify-center gap-2">
                ยืนยันการตัดจ่าย
            </button>
        </div>
    </div>
    <datalist id="reqList"></datalist>

    <!-- 🌟 Overlay สำหรับเปิดกล้องสแกน (ทำเอง ไม่ใช้ Swal ป้องกันบัค) -->
    <div id="scanner-overlay" class="hidden fixed inset-0 z-[100] bg-slate-900/95 backdrop-blur-sm flex flex-col">
        <div class="p-5 flex justify-between items-center text-white shrink-0">
            <h3 class="text-lg font-black flex items-center gap-2"><svg class="w-6 h-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg> สแกนบาร์โค้ด</h3>
            <button onclick="closeScanner()" class="w-10 h-10 bg-white/20 hover:bg-rose-500 rounded-full flex items-center justify-center transition-colors focus:outline-none">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="flex-1 flex flex-col items-center justify-center p-4">
            <div id="reader"></div>
            <p class="text-slate-400 text-sm mt-6 text-center">หันกล้องไปที่บาร์โค้ดของวัสดุเพื่อหยิบใส่ตะกร้า</p>
        </div>
        
        <!-- Toast แจ้งเตือนเวลาสแกนติด (เด้งภายใน Overlay) -->
        <div id="scan-toast" class="absolute bottom-10 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-white px-6 py-3 rounded-full font-bold shadow-lg shadow-emerald-500/50 transition-all duration-300 opacity-0 translate-y-10 pointer-events-none flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
            <span id="scan-toast-text"></span>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚨 นำ Web App URL ของ Google Apps Script มาใส่ตรงนี้
        // ==========================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz_FvpCG7ZHmnfNtiBpAfvE-wlr80TadtEGUJfZjk2Kx2kLzEfDW0wSNRIVHWpGtnO_/exec"; 
        
        let matStockData = [];
        let posCart = [];
        let html5QrcodeScanner;
        let posSearchTerm = '';
        let posCategory = 'all';

        const beepSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

        window.onload = function() {
            // เซ็ตวันที่ปัจจุบัน
            let ts = new Date();
            document.getElementById('pos-date').value = ts.getFullYear() + "-" + String(ts.getMonth() + 1).padStart(2, '0') + "-" + String(ts.getDate()).padStart(2, '0');
            
            fetchStockData();
        };

        // 🟢 1. โหลดข้อมูลจาก Google Sheets
        function fetchStockData() {
            if (GAS_URL === "YOUR_WEB_APP_URL_HERE") {
                Swal.fire('แจ้งเตือน', 'กรุณาตั้งค่า GAS_URL ในโค้ดก่อนใช้งาน', 'error');
                return;
            }

            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'fetchData' })
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === 'success') {
                    // จัดการ Data
                    matStockData = result.matStockData || [];
                    let matHistoryData = result.matHistoryData || [];

                    // กำหนด Index จริงให้แต่ละแถว
                    matStockData.forEach((row, idx) => { row.originalIndex = idx + 1; });

                    // สร้างตัวเลือกหมวดหมู่
                    let cats = [...new Set(matStockData.map(r => String(r[4]||'').trim()).filter(c => c))].sort();
                    let catSelect = document.getElementById('pos-cat');
                    catSelect.innerHTML = '<option value="all">ทุกหมวดหมู่</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');

                    // สร้างตัวเลือกผู้เบิก
                    let requesters = [...new Set(matHistoryData.filter(h => h[2] === "เบิกจ่าย (ตัดสต๊อก)").map(h => String(h[3]||'').trim()).filter(r => r && r !== '-'))].sort();
                    document.getElementById('reqList').innerHTML = requesters.map(r => `<option value="${r}">`).join('');

                    // เปลี่ยนสถานะมุมขวาบน
                    let statusEl = document.getElementById('status-indicator');
                    statusEl.className = 'text-[10px] font-bold text-emerald-600 flex items-center gap-1';
                    statusEl.innerHTML = '<div class="w-2 h-2 rounded-full bg-emerald-500"></div> ออนไลน์';

                    renderPOSProducts();
                    renderPOSCart();
                }
            })
            .catch(error => {
                document.getElementById('status-indicator').innerHTML = '<span class="text-rose-500">❌ ออฟไลน์</span>';
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
            });
        }

        // 🟢 2. เรนเดอร์การ์ดสินค้า (สี่เหลี่ยมจัตุรัสแบบที่ออกแบบไว้)
        const getCategoryTheme = (category) => {
            if (category.includes('คอมพิวเตอร์') || category.includes('ไอที')) return { border: 'from-blue-600 to-indigo-500', text: 'text-indigo-600', badge: 'from-blue-500 to-indigo-500' };
            if (category.includes('สำนักงาน') || category.includes('กระดาษ')) return { border: 'from-emerald-400 to-teal-500', text: 'text-teal-600', badge: 'from-emerald-400 to-teal-500' };
            if (category.includes('บ้าน') || category.includes('ครัว')) return { border: 'from-amber-400 to-orange-500', text: 'text-orange-600', badge: 'from-amber-400 to-orange-500' };
            if (category.includes('แพทย์') || category.includes('ยา')) return { border: 'from-cyan-400 to-blue-500', text: 'text-cyan-600', badge: 'from-cyan-400 to-blue-500' };
            return { border: 'from-indigo-400 to-blue-500', text: 'text-indigo-600', badge: 'from-indigo-400 to-blue-500' };
        };

        window.renderPOSProducts = function() {
            let container = document.getElementById('pos-product-grid');
            if(!matStockData.length) return;

            let filtered = matStockData.filter(row => {
                let qty = parseFloat(row[5]) || 0;
                if (qty <= 0) return false; 
                let matchSearch = posSearchTerm === '' || (row[1]||'').toLowerCase().includes(posSearchTerm) || (row[2]||'').toLowerCase().includes(posSearchTerm);
                let matchCat = posCategory === 'all' || (row[4]||'') === posCategory;
                return matchSearch && matchCat;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="col-span-full py-10 text-center text-slate-400 font-bold">ไม่พบวัสดุที่ค้นหา</div>';
                return;
            }

            let html = '';
            filtered.forEach(row => {
                let code = row[0], barcode = row[1] || '', name = row[2] || '', cat = row[4] || '-', loc = row[9] || '-';
                let qty = parseFloat(row[5]) || 0, unit = row[6] || '', price = parseFloat(row[7]) || 0;
                
                let theme = getCategoryTheme(cat);
                let imgs = []; try { imgs = JSON.parse(row[11] || '[]'); } catch(e){}
                let imgUrl = imgs.length > 0 ? 'https://drive.google.com/thumbnail?id=' + imgs[0] + '&sz=w300' : '';
                
                let imgTag = imgUrl ? `<img src="${imgUrl}" class="w-full h-full object-contain group-hover:scale-110 transition-transform duration-500 p-1">` : `<div class="w-full h-full flex items-center justify-center text-slate-300"><svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></div>`;

                let inCart = posCart.find(c => c.index === row.originalIndex);
                let cartQty = inCart ? inCart.qty : 0;
                let remain = qty - cartQty;
                let isDisable = remain <= 0;

                let safeName = name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                let actionCall = isDisable ? '' : `addToCart(${row.originalIndex}, '${code}', '${barcode}', '${safeName}', ${qty}, '${unit}', ${price})`;

                html += `
                <div class="relative w-full aspect-square rounded-[1.25rem] bg-gradient-to-br ${theme.border} p-[2px] shadow-sm hover:shadow-md transition-all duration-300 group ${isDisable ? 'opacity-50 grayscale cursor-not-allowed' : 'cursor-pointer hover:-translate-y-1'}" onclick="${actionCall}">
                    <div class="w-full h-full bg-white rounded-[calc(1.25rem-2px)] flex flex-col overflow-hidden relative">
                        ${cartQty > 0 ? `<div class="absolute top-1.5 right-1.5 bg-rose-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-black shadow-md z-10 border-2 border-white">${cartQty}</div>` : ''}
                        
                        <div class="flex-1 min-h-0 w-full bg-white relative flex items-center justify-center p-2">${imgTag}</div>
                        
                        <div class="flex justify-between items-center px-2.5 py-1.5 bg-white gap-2 shrink-0">
                            <h4 class="text-[12px] sm:text-[13px] font-black text-slate-800 truncate flex-1" title="${name}">${name}</h4>
                            <div class="bg-gradient-to-r ${theme.badge} text-white rounded-md px-2 py-0.5 flex items-baseline gap-1 shadow-sm shrink-0">
                                <span class="text-base sm:text-lg font-black leading-none ${remain > 0 ? '' : 'text-rose-200'}">${remain}</span>
                                <span class="text-[9px] font-bold leading-none">${unit}</span>
                            </div>
                        </div>
                        
                        <div class="border-t border-slate-100 flex justify-between items-center px-2.5 py-1.5 bg-white shrink-0">
                            <span class="text-[9px] font-black ${theme.text} truncate pr-1">${cat}</span>
                            <span class="text-[9px] font-black ${theme.text} shrink-0">${loc}</span>
                        </div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        // 🟢 3. จัดการตะกร้า
        window.addToCart = function(index, code, barcode, name, maxQty, unit, price) {
            let existing = posCart.find(c => c.index === index);
            if (existing) {
                if (existing.qty < maxQty) existing.qty++;
                else return; // ตันแล้ว
            } else {
                posCart.push({ index, code, barcode, name, maxQty, qty: 1, unit, price });
            }
            renderPOSCart();
            renderPOSProducts();
        }

        window.updateCartQty = function(cartIdx, delta) {
            let item = posCart[cartIdx];
            if(!item) return;
            item.qty += delta;
            if (item.qty <= 0) posCart.splice(cartIdx, 1);
            else if (item.qty > item.maxQty) item.qty = item.maxQty;
            renderPOSCart();
            renderPOSProducts();
        }

        window.removeFromCart = function(cartIdx) {
            posCart.splice(cartIdx, 1);
            renderPOSCart();
            renderPOSProducts();
        }

        window.renderPOSCart = function() {
            let container = document.getElementById('pos-cart-items');
            let btn = document.getElementById('checkout-btn');
            document.getElementById('pos-cart-count').innerText = posCart.length + " รายการ";

            if (posCart.length === 0) {
                container.innerHTML = '<div class="py-10 text-center text-slate-400 font-bold">ตะกร้าว่างเปล่า</div>';
                btn.disabled = true;
                btn.className = "w-full py-3.5 bg-slate-200 text-slate-400 font-black text-sm rounded-xl transition-all flex items-center justify-center gap-2";
                return;
            }

            btn.disabled = false;
            btn.className = "w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black text-sm rounded-xl shadow-lg shadow-blue-500/30 transition-all transform hover:-translate-y-1 flex items-center justify-center gap-2";

            let html = '';
            posCart.forEach((item, idx) => {
                html += `
                <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between gap-2">
                    <div class="flex-1 min-w-0 pr-1">
                        <p class="text-[9px] font-black text-blue-500 tracking-widest truncate uppercase">${item.barcode || item.code}</p>
                        <h4 class="text-xs font-black text-slate-700 truncate">${item.name}</h4>
                    </div>
                    <div class="flex items-center bg-slate-50 border border-slate-100 rounded-full p-0.5 shrink-0">
                        <button onclick="updateCartQty(${idx}, -1)" class="w-6 h-6 flex items-center justify-center rounded-full bg-white text-slate-500 shadow-sm"><svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M20 12H4"/></svg></button>
                        <span class="text-xs font-black text-slate-800 w-6 text-center">${item.qty}</span>
                        <button onclick="updateCartQty(${idx}, 1)" class="w-6 h-6 flex items-center justify-center rounded-full bg-white text-blue-600 shadow-sm"><svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"/></svg></button>
                    </div>
                    <button onclick="removeFromCart(${idx})" class="w-7 h-7 shrink-0 flex items-center justify-center text-rose-400 bg-rose-50 rounded-full ml-1"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
                </div>`;
            });
            container.innerHTML = html;
        }

        // 🟢 4. ระบบสแกนบาร์โค้ดผ่านกล้อง
        function openScanner() {
            document.getElementById('scanner-overlay').classList.remove('hidden');
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
                fps: 10, 
                qrbox: {width: 250, height: 100},
                aspectRatio: 1.0,
                showTorchButtonIfSupported: true
            }, false);
            html5QrcodeScanner.render(onScanSuccess);
        }

        function closeScanner() {
            document.getElementById('scanner-overlay').classList.add('hidden');
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear();
            }
        }

        let scanCooldown = false;
        function onScanSuccess(decodedText) {
            if (scanCooldown) return; 
            
            let barcode = decodedText.trim().toLowerCase();
            let foundItem = matStockData.find(r => (r[1]||'').toLowerCase() === barcode || (r[0]||'').toLowerCase() === barcode);
            
            if (foundItem) {
                let existingInCart = posCart.find(c => c.index === foundItem.originalIndex);
                let cartQty = existingInCart ? existingInCart.qty : 0;
                let remain = (parseFloat(foundItem[5]) || 0) - cartQty;

                if (remain > 0) {
                    beepSound.play().catch(e=>{});
                    addToCart(foundItem.originalIndex, foundItem[0], foundItem[1], foundItem[2], parseFloat(foundItem[5]), foundItem[6], parseFloat(foundItem[7]));
                    
                    // แสดง Toast สีเขียวเด้งขึ้นมา
                    let toast = document.getElementById('scan-toast');
                    document.getElementById('scan-toast-text').innerText = `เพิ่ม ${foundItem[2]} แล้ว`;
                    toast.classList.remove('opacity-0', 'translate-y-10');
                    setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-10'); }, 1500);
                }
            }

            scanCooldown = true;
            setTimeout(() => { scanCooldown = false; }, 1500);
        }

        // 🟢 5. ยืนยันการเบิกจ่าย
        window.submitPOS = function() {
            let ref = document.getElementById('pos-ref').value.trim();
            if(!ref) {
                Swal.fire({title: 'ข้อมูลไม่ครบ', text: 'กรุณาระบุ ชื่อผู้เบิก / อ้างอิง', icon: 'warning', confirmButtonColor: '#3b82f6', customClass:{popup:'!rounded-[2rem]'}});
                return;
            }

            let rawDate = document.getElementById('pos-date').value;
            let finalSaveDate = '';
            if(rawDate) {
                let dParts = rawDate.split('-'); 
                let y = parseInt(dParts[0]); if(y < 2500) y += 543; 
                finalSaveDate = dParts[2] + '/' + dParts[1] + '/' + y;
            }
            let remark = document.getElementById('pos-remark').value.trim();

            Swal.fire({
                title: 'ยืนยันการตัดจ่าย?',
                html: `<div class="bg-slate-50 p-4 rounded-xl border border-slate-100 mb-3"><p class="text-sm font-bold text-slate-700">รายการวัสดุ <span class="text-blue-600">${posCart.length}</span> รายการ</p><p class="text-xs text-slate-500 mt-1">ผู้เบิก: ${ref}</p></div>`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'ยืนยัน',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#2563eb',
                customClass: { popup: '!rounded-[2rem]' }
            }).then((res) => {
                if (res.isConfirmed) {
                    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
                    
                    let payload = {
                        action: 'dispenseMaterial',
                        date: finalSaveDate,
                        ref: ref,
                        remark: remark,
                        items: posCart.map(c => ({ code: c.code, barcode: c.barcode, name: c.name, qty: c.qty, unit: c.unit, price: c.price }))
                    };

                    fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    }).then(r => r.json()).then(res => {
                        if (res.status === 'success') {
                            Swal.fire({ title: 'ตัดจ่ายสำเร็จ!', icon: 'success', timer: 1500, showConfirmButton: false, customClass:{popup:'!rounded-[2rem]'} });
                            posCart = [];
                            document.getElementById('pos-ref').value = '';
                            document.getElementById('pos-remark').value = '';
                            fetchStockData();
                        } else {
                            Swal.fire('ข้อผิดพลาด', res.message, 'error');
                        }
                    }).catch(e => Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error'));
                }
            });
        }
    </script>
